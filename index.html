<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>StableFlow — Merchant Graphic Generator</title>
<style>
  :root{
    --navy:#1B2A6B;
    --blue1:#0EA5FF;
    --blue2:#0B7FE0;
    --ink:#12172B;
    --paper:#F4F6FA;
    --line:#DCE1EC;
    --muted:#6B7386;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
    background:var(--paper);
    color:var(--ink);
  }
  .app{
    display:grid;
    grid-template-columns:360px 1fr;
    min-height:100vh;
  }
  @media (max-width:820px){
    .app{grid-template-columns:1fr;}
  }
  .panel{
    background:#fff;
    border-right:1px solid var(--line);
    padding:28px 24px 40px;
  }
  .panel h1{
    font-size:17px;
    margin:0 0 4px;
    letter-spacing:-0.01em;
  }
  .panel .sub{
    font-size:13px;
    color:var(--muted);
    margin:0 0 24px;
  }
  label{
    display:block;
    font-size:12px;
    font-weight:600;
    color:var(--ink);
    margin:20px 0 6px;
  }
  label .hint{
    font-weight:400;
    color:var(--muted);
    display:block;
    font-size:11px;
    margin-top:2px;
  }
  input[type=text]{
    width:100%;
    padding:10px 12px;
    border:1px solid var(--line);
    border-radius:8px;
    font-size:14px;
    font-family:inherit;
    background:var(--paper);
    color:var(--ink);
  }
  input[type=text]:focus{
    outline:none;
    border-color:var(--blue2);
    background:#fff;
    color:var(--ink);
  }
  .drop{
    border:1.5px dashed var(--line);
    border-radius:8px;
    padding:16px;
    text-align:center;
    font-size:12px;
    color:var(--muted);
    cursor:pointer;
    background:var(--paper);
  }
  .drop:hover{border-color:var(--blue2);}
  .drop.has-file{border-style:solid; border-color:var(--blue2); color:var(--ink);}
  input[type=file]{display:none;}
  .clear-btn{
    font-size:11px;
    color:var(--muted);
    background:none;
    border:none;
    text-decoration:underline;
    cursor:pointer;
    padding:0;
    margin-top:6px;
  }
  .venue-toggle{display:flex; gap:8px; margin-top:20px;}
  .venue-toggle button{
    flex:1;
    padding:8px;
    font-size:12px;
    border:1px solid var(--line);
    background:var(--paper);
    border-radius:8px;
    cursor:pointer;
    color:var(--muted);
  }
  .venue-toggle button.active{
    border-color:var(--blue2);
    color:var(--blue2);
    background:#EAF4FF;
    font-weight:600;
  }
  .actions{
    margin-top:28px;
    padding-top:20px;
    border-top:1px solid var(--line);
  }
  .download-btn{
    width:100%;
    padding:13px;
    background:var(--navy);
    color:#fff;
    border:none;
    border-radius:8px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
  }
  .download-btn:hover{background:#101F55;}
  .status{
    font-size:11px;
    color:var(--muted);
    margin-top:10px;
    min-height:14px;
  }
  .status.err{color:#C0392B;}
  .preview-wrap{
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px;
  }
  .canvas-shell{
    box-shadow:0 20px 50px rgba(20,30,60,0.18);
    border-radius:6px;
    overflow:hidden;
    max-width:100%;
  }
  canvas{
    display:block;
    width:min(460px, 82vw);
    height:auto;
  }
</style>
</head>
<body>
<div class="app">
  <div class="panel">
    <h1>Merchant graphic generator</h1>
    <p class="sub">Fill in a business, download the branded QR graphic.</p>

    <label>Business name
      <span class="hint">Used if no logo is uploaded, and always used for the file name.</span>
    </label>
    <input type="text" id="bizName" placeholder="e.g. The Patio Ibadan" value="The Patio Ibadan">

    <label>Business logo (optional)
      <span class="hint">PNG/SVG with transparent background works best.</span>
    </label>
    <div class="drop" id="dropZone">Click to upload logo</div>
    <input type="file" id="logoFile" accept="image/*">
    <button class="clear-btn" id="clearLogo" style="display:none;">Remove logo</button>

    <label>Wallet address (encoded in QR)
      <span class="hint">The address customers pay into.</span>
    </label>
    <input type="text" id="wallet" placeholder="0x..." value="0x1a2B3c4D5e6F7890aBcDeF1234567890aBCDef12">

    <label>Fallback name style
      <span class="hint">Only used when no logo is uploaded.</span>
    </label>
    <div class="venue-toggle">
      <button data-style="gold" class="active">Gold serif</button>
      <button data-style="navy">Navy sans</button>
    </div>

    <div class="actions">
      <button class="download-btn" id="downloadBtn">Download PNG</button>
      <div class="status" id="status"></div>
    </div>
  </div>

  <div class="preview-wrap">
    <div class="canvas-shell">
      <canvas id="canvas" width="1080" height="1125"></canvas>
    </div>
  </div>
</div>

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const CANVAS_W = 1080;
const CANVAS_H = 1125;

// QR State & Render Control
let currentQRImage = null;
let isQRReady = false;
let qrGenToken = 0;

// Helper: Rounded Rectangle Path
function drawRoundedRect(ctx, x, y, width, height, radius) {
  ctx.beginPath();
  ctx.moveTo(x + radius, y);
  ctx.lineTo(x + width - radius, y);
  ctx.arcTo(x + width, y, x + width, y + radius, radius);
  ctx.lineTo(x + width, y + height - radius);
  ctx.arcTo(x + width, y + height, x + width - radius, y + height, radius);
  ctx.lineTo(x + radius, y + height);
  ctx.arcTo(x, y + height, x, y + height - radius, radius);
  ctx.lineTo(x, y + radius);
  ctx.arcTo(x, y, x + radius, y, radius);
  ctx.closePath();
}

// Main Canvas Drawing Pipeline
function renderCanvas() {
  ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);

  // 1. Base Background Fill
  ctx.fillStyle = '#F7F7F7';
  ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

  // 2. Top Blue Gradient Header
  const blueGradient = ctx.createLinearGradient(0, 0, CANVAS_W, 420);
  blueGradient.addColorStop(0, '#0EA5FF');
  blueGradient.addColorStop(1, '#0B7FE0');
  ctx.fillStyle = blueGradient;
  ctx.fillRect(0, 0, CANVAS_W, 430);

  // 3. Curved Wave Overlay
  if (loadedAssets.subtract) {
    ctx.drawImage(loadedAssets.subtract, 0, 136, 1080, 989);
  }

  // 4. StableFlow Wordmark Header (Top-Left)
  if (loadedAssets.wordmark) {
    ctx.drawImage(loadedAssets.wordmark, 85, 85, 223, 38);
  }

  // 5. "Start Accepting Payments" Badge (Top-Right)
  if (loadedAssets.startAccepting) {
    ctx.drawImage(loadedAssets.startAccepting, 722, 86, 255, 19);
  }

  // 6. Headline Text / Banner Image
  if (loadedAssets.headline) {
    ctx.drawImage(loadedAssets.headline, 319, 228, 442, 63);
  }

  // 7. Decorative Floating Coin (Top-Left)
  if (loadedAssets.coinTL) {
    ctx.drawImage(loadedAssets.coinTL, 283, 274, 104, 95);
  }

  // 8. Business Logo / Fallback Text
  const logoCenterY = 400;
  if (activeState.logoImg) {
    const maxW = 480;
    const maxH = 100;
    let imgW = activeState.logoImg.width;
    let imgH = activeState.logoImg.height;
    const scale = Math.min(maxW / imgW, maxH / imgH);
    imgW *= scale;
    imgH *= scale;
    ctx.drawImage(activeState.logoImg, CANVAS_W / 2 - imgW / 2, logoCenterY - imgH / 2, imgW, imgH);
  } else {
    ctx.textAlign = 'center';
    if (activeState.fallbackStyle === 'gold') {
      ctx.fillStyle = '#8A6D3B';
      ctx.font = '600 42px Georgia, "Times New Roman", serif';
    } else {
      ctx.fillStyle = '#1B2A6B';
      ctx.font = '700 40px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif';
    }
    ctx.fillText(activeState.bizName || 'Your Business Name', CANVAS_W / 2, logoCenterY + 12);
  }

  // 9. QR Panel Container (Card with Drop Shadow)
  const panelX = 325;
  const panelY = 442;
  const panelSize = 428;

  ctx.save();
  ctx.shadowColor = 'rgba(20,30,60,0.18)';
  ctx.shadowBlur = 28;
  ctx.shadowOffsetY = 14;
  drawRoundedRect(ctx, panelX, panelY, panelSize, panelSize, 26);
  ctx.fillStyle = '#ffffff';
  ctx.fill();
  ctx.restore();

  // 10. Draw QR Code into Panel
  const qrMargin = 38;
  const qrDrawSize = panelSize - qrMargin * 2;

  if (isQRReady && currentQRImage) {
    ctx.drawImage(currentQRImage, panelX + qrMargin, panelY + qrMargin, qrDrawSize, qrDrawSize);
  } else {
    ctx.fillStyle = '#F0F1F5';
    drawRoundedRect(ctx, panelX + qrMargin, panelY + qrMargin, qrDrawSize, qrDrawSize, 12);
    ctx.fill();

    ctx.textAlign = 'center';
    ctx.font = '600 20px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
    ctx.fillStyle = '#8B93A6';
    ctx.fillText('Generating QR Code...', panelX + panelSize / 2, panelY + panelSize / 2);
  }

  // 11. Decorative Floating Coin (Bottom-Right)
  if (loadedAssets.coinBR) {
    ctx.drawImage(loadedAssets.coinBR, 769, 828, 119, 102);
  }

  // 12. Footer Pill Cards (Assets & Networks)
  if (loadedAssets.assetsPills) {
    ctx.drawImage(loadedAssets.assetsPills, 85, 940, 199, 63);
  }
  if (loadedAssets.networksPills) {
    ctx.drawImage(loadedAssets.networksPills, 313, 940, 420, 103);
  }

  // 13. "Powered By" Footer Branding
  if (loadedAssets.poweredBy) {
    ctx.drawImage(loadedAssets.poweredBy, 820, 1023, 196, 19);
  }
}

// Convert QRInstance raw Blob to HTMLImageElement using Data URL
function convertQRBlobToImage(qrInstance) {
  return qrInstance.getRawData('png').then(blob => {
    if (!blob) throw new Error('QRCodeStyling returned empty blob');
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = (err) => reject(err);
        img.src = reader.result;
      };
      reader.onerror = (err) => reject(err);
      reader.readAsDataURL(blob);
    });
  });
}

const STABLEFLOW_CENTER_LOGO = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%23ffffff'/><path d='M 30,20 C 15,40 20,75 55,80 C 75,83 80,75 75,65 C 65,80 30,75 35,45 C 37,33 45,23 55,20 Z' fill='%2315182B'/><circle cx='60' cy='45' r='22' fill='%2315182B'/><polygon points='60,33 63,42 72,45 63,48 60,57 57,48 48,45 57,42' fill='%23ffffff'/></svg>";

// Primary Styled QR Code Configuration
function createStyledQRInstance(walletData) {
  const qrLogo = (typeof ASSETS !== 'undefined' && ASSETS.qrCenterLogo) ? ASSETS.qrCenterLogo : STABLEFLOW_CENTER_LOGO;
  return new QRCodeStyling({
    width: 700,
    height: 700,
    type: 'canvas',
    data: walletData,
    margin: 0,
    image: qrLogo,
    qrOptions: { errorCorrectionLevel: 'H' },
    imageOptions: { hideBackgroundDots: true, imageSize: 0.32, margin: 6 },
    dotsOptions: { color: '#15182B', type: 'rounded' },
    cornersSquareOptions: { type: 'dot', color: '#15182B' },
    cornersDotOptions: { type: 'dot', color: '#15182B' },
    backgroundOptions: { color: '#ffffff' }
  });
}

// Fallback Plain Square QR Code Configuration
function createFallbackQRInstance(walletData) {
  return new QRCodeStyling({
    width: 700,
    height: 700,
    type: 'canvas',
    data: walletData,
    margin: 8,
    qrOptions: { errorCorrectionLevel: 'M' },
    dotsOptions: { color: '#15182B', type: 'square' },
    cornersSquareOptions: { type: 'square', color: '#15182B' },
    cornersDotOptions: { type: 'square', color: '#15182B' },
    backgroundOptions: { color: '#ffffff' }
  });
}

// Async QR Generation Controller
function generateQRCode(walletAddress) {
  const targetData = (walletAddress && walletAddress.trim().length > 0) 
    ? walletAddress.trim() 
    : '0x0000000000000000000000000000000000dead';
    
  const currentToken = ++qrGenToken;
  isQRReady = false;
  renderCanvas();

  let resolved = false;

  // Timeout guard for fallback rendering
  const timeoutId = setTimeout(() => {
    if (resolved || currentToken !== qrGenToken) return;
    
    const fallbackQR = createFallbackQRInstance(targetData);
    convertQRBlobToImage(fallbackQR).then(img => {
      if (currentToken !== qrGenToken || resolved) return;
      resolved = true;
      currentQRImage = img;
      isQRReady = true;
      renderCanvas();
    }).catch(err => {
      if (currentToken !== qrGenToken) return;
      console.error('Fallback QR code failed:', err);
      const statusEl = document.getElementById('status');
      statusEl.textContent = 'Failed to generate QR code.';
      statusEl.classList.add('err');
      renderCanvas();
    });
  }, 2500);

  // Primary rendering attempt
  const styledQR = createStyledQRInstance(targetData);
  convertQRBlobToImage(styledQR).then(img => {
    if (currentToken !== qrGenToken || resolved) return;
    resolved = true;
    clearTimeout(timeoutId);
    currentQRImage = img;
    isQRReady = true;
    renderCanvas();
  }).catch(err => {
    console.warn('Styled QR failed, attempting fallback...', err);
  });
}

// Form Controls & UI Event Handling
const bizNameInput = document.getElementById('bizName');
const walletInput = document.getElementById('wallet');
const logoFileInput = document.getElementById('logoFile');
const dropZone = document.getElementById('dropZone');
const clearLogoBtn = document.getElementById('clearLogo');
const downloadBtn = document.getElementById('downloadBtn');
const statusEl = document.getElementById('status');

bizNameInput.addEventListener('input', (e) => {
  activeState.bizName = e.target.value;
  renderCanvas();
});

walletInput.addEventListener('input', (e) => {
  activeState.wallet = e.target.value.trim();
  statusEl.textContent = '';
  statusEl.classList.remove('err');
  generateQRCode(activeState.wallet);
});

dropZone.addEventListener('click', () => logoFileInput.click());

logoFileInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = (event) => {
    const img = new Image();
    img.onload = () => {
      activeState.logoImg = img;
      dropZone.textContent = file.name;
      dropZone.classList.add('has-file');
      clearLogoBtn.style.display = 'inline';
      renderCanvas();
    };
    img.src = event.target.result;
  };
  reader.readAsDataURL(file);
});

clearLogoBtn.addEventListener('click', () => {
  activeState.logoImg = null;
  logoFileInput.value = '';
  dropZone.textContent = 'Click to upload logo';
  dropZone.classList.remove('has-file');
  clearLogoBtn.style.display = 'none';
  renderCanvas();
});

document.querySelectorAll('.venue-toggle button').forEach(button => {
  button.addEventListener('click', () => {
    document.querySelectorAll('.venue-toggle button').forEach(b => b.classList.remove('active'));
    button.classList.add('active');
    activeState.fallbackStyle = button.dataset.style;
    renderCanvas();
  });
});

downloadBtn.addEventListener('click', () => {
  if (!activeState.wallet) {
    statusEl.textContent = 'Please enter a valid wallet address.';
    statusEl.classList.add('err');
    return;
  }
  if (!isQRReady) {
    statusEl.textContent = 'QR Code is generating, please wait...';
    statusEl.classList.add('err');
    return;
  }

  const sanitizedBizName = (activeState.bizName || 'merchant')
    .toLowerCase()
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/(^-|-$)/g, '');
    
  const downloadLink = document.createElement('a');
  downloadLink.download = `stableflow-${sanitizedBizName || 'merchant'}.png`;
  downloadLink.href = canvas.toDataURL('image/png');
  downloadLink.click();
});

// Initialization
preloadAssets(() => {
  activeState.bizName = bizNameInput.value;
  activeState.wallet = walletInput.value;
  generateQRCode(activeState.wallet);
});
</script>
